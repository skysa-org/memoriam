# Placeholders only. A self-hoster fills in database_id after `wrangler d1 create`
# and sets every secret with `wrangler secret put` (see .dev.vars.example).
name = "memoriam"
main = "src/worker.ts"
# No nodejs_compat: the Worker uses only Web Crypto and fetch (skysa-notes'
# `docs/ARCHITECTURE.md` §6).
compatibility_date = "2026-09-14"

# The PWA is served from this same Worker so /api/* and the app share an origin
# and the OAuth flow cookie stays first-party.
# https://developers.cloudflare.com/workers/static-assets/routing/worker-script/
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "memoriam"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Only what this deployment can actually do. Dropbox, OneDrive and Google
# Drive are implemented.
#
# Listing a provider commits the deployment to having its credentials —
# `parseEnv` refuses to boot without them — so a clean clone answers 500 until
# the operator registers a Dropbox app and sets the two secrets. That is the
# intended failure: it names the missing key at boot, where a deployment that
# booted without Dropbox would answer `/auth/connect/dropbox/start` with 404
# `unsupported_provider` and nothing to say why.
ENABLED_PROVIDERS = "dropbox"

[observability]
enabled = true

# Workers Paid only: caps runaway CPU cost. Harmless to leave set on Free.
[limits]
cpu_ms = 50
